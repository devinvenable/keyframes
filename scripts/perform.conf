# perform.conf — mixer-source defaults for scripts/perform.sh (sourced at
# startup; override the path with PERFORM_CONF).
#
# MIXER_SOURCE_PATTERN  ERE matched against `pactl list short sources`
#                       names (monitor sources are excluded); the first
#                       match becomes the mixer audio track. Matching is by
#                       name only, so a SUSPENDED (idle) device still wins.
# MIXER_SOURCE          exact pactl source name; takes precedence over the
#                       pattern when set.
#
# Both lose to --mixer-source / PERFORM_MIXER_SOURCE. When the configured
# device is absent, perform.sh falls back to the Pulse default source with
# a warning instead of aborting.
#
# The default pattern matches the Behringer mixer's USB interface, which
# enumerates as a Burr-Brown/TI USB Audio CODEC:
#   alsa_input.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00.analog-stereo-input
MIXER_SOURCE_PATTERN='Burr-Brown|USB_Audio_CODEC'
